# DeepSeek API 峰谷时段（北京时间）。官方：https://api-docs.deepseek.com/zh-cn/quick_start/pricing
# “北京时间周一至周五（不含中国法定节假日）9:00 - 12:00、14:00 - 18:00 为高峰时段；其余时段，
#   包括周末及中国法定节假日全天均为空闲时段。”空闲时段价格为高峰时段的一半。
# 另据 DeepSeek 2026-09-19 的说明：调休上班的周末也按空闲时段计费（周末一律是谷时）。
# 官方规则变化时改这里即可；文件缺失时使用程序内置的同一套默认值。
peak_weekdays: [0, 1, 2, 3, 4]          # 0=周一 … 4=周五
peak_windows: [["09:00", "12:00"], ["14:00", "18:00"]]

# 中国法定节假日：取国务院办公厅放假安排中的“放假”日期（含调休放假的工作日）。
# 每年 11 月前后国务院发布次年安排后在这里追加；没有列出的年份按普通工作日处理（只会更保守）。
holidays:
  # 国办发明电〔2025〕7号 https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm
  - 2026-01-01..2026-01-03
  - 2026-02-15..2026-02-23
  - 2026-04-04..2026-04-06
  - 2026-05-01..2026-05-05
  - 2026-06-19..2026-06-21
  - 2026-09-25..2026-09-27
  - 2026-10-01..2026-10-07
  # 国办发明电〔2026〕10号 https://www.gov.cn/zhengce/content/202611/content_7085101.htm
  - 2027-01-01..2027-01-03
  - 2027-02-05..2027-02-13
  - 2027-04-03..2027-04-05
  - 2027-05-01..2027-05-05
  - 2027-06-09
  - 2027-09-15
  - 2027-10-01..2027-10-07
