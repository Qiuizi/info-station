# 规则预筛：没有 API Key 时，这里的分数就是最终分；有 Key 时只是模型打分前的临时分与兜底。
# 改动后重启后端，未经模型打分的条目会按新规则自动重算。
rule_cap: 75             # 规则分上限：规则分不会高过模型给出的“必看”分
content_boost_cap: 12    # 关键词只在正文出现时按一半计分，正文加分总额封顶
expired_penalty: 15      # 已过截止
age_penalty: [[14, -5], [30, -12], [90, -25]]   # 发布超过 N 天（且没有未到的截止）扣分
rule_notify_urgent: 65   # 还没经模型打分、规则识别出三天内截止且规则分 ≥ 此值时即时提醒
source_adjust:           # 按信源微调规则分：新闻稿 / 成果报道类信源以“了解”为主
  scu-news: -10
  sw-kjcx: -8
engagement_bonus: [[100, 3], [500, 6], [2000, 10], [10000, 14]]   # 推文互动（赞 + 3×转 + 2×引用）≥ N 加分，取最高一档
sender_boost:       # 邮件：发件人域名加分（含子域名，学生邮箱 stu.scu.edu.cn 也算）
  scu.edu.cn: 15
category_boost:     # 只对某个分类生效的加分词（计分方式同 boost）
  email: {通知: 6, 截止: 8, 报名: 8, 面试: 12, offer: 12, 录用: 10, 录取: 10}
category_base:      # 各分类基础分
  school: 42
  competition: 50
  tech: 35
  news: 26
  feishu: 45
  email: 40
tier_bonus: {T1: 8, T2: 0}

boost:              # 标题命中全额加分；只在正文出现按一半计（英文按词边界匹配）
  竞赛: 12
  大赛: 10
  挑战杯: 14
  互联网+: 10
  "大学生创新创业": 14
  大创: 14
  科研训练: 12
  实验室: 8
  CSP: 14
  蓝桥杯: 10
  ACM: 10
  ICPC: 10
  奖学金: 12
  助学金: 6
  评选: 6
  报名: 8
  选课: 12
  考试安排: 12
  四六级: 12
  六级: 10
  CET: 10

  交换: 6
  暑期: 4
  保研: 6
  夏令营: 4
  实习: 6
  截止: 6
  DeepSeek: 8
  大模型: 6
  开源: 4
  Release: 2

penalty:            # 只看标题，命中扣分
  领导接待日: -30
  选聘: -15
  教学质量简报: -15
  基层教学组织: -15
  公示: -10          # 获奖/立项结果公示：了解即可
  # 喜报 / 新闻稿 / 已结束的活动：了解即可
  喜报: -15
  佳绩: -12
  荣获: -10
  问鼎: -12
  斩获: -12
  夺冠: -12
  突围: -8
  获评: -10
  入选: -8
  取得新进展: -12
  取得突破: -12
  研究成果: -10
  发表于: -8
  担任: -10
  顺利举行: -15
  圆满: -15
  成功举办: -12
  召开: -10
  举行: -8
  活动启动: -10
  班会: -10
  成绩查询: -15
  考点信息: -8
  结果公示: -10
  招聘: -8
  讲座预告: -6
  党委: -10
  学术报告: -6
  广告: -20

audience:           # 适用对象（只看标题）：年级按「设置 → 画像 → 年级」自动识别，同年级 +12、其他年级 -12
  include_bonus: 6
  include: [本科生, 全体学生, 大学生, 新生, 低年级]
  exclude_penalty: -14
  exclude: [研究生, 博士, 教职工, 教师, 离校, 毕业论文, 毕业生, 博士后, 幼儿园]

# ---------------------------------------------------------------- 模型打分的合成
llm_blend:
  dims_weight: 0.5        # 最终模型分 = 模型总分 ×(1-x) + 五维加权分 × x（五维权重见下）
  eligibility_cap: 40     # 学校/竞赛条目：模型判定读者不在适用对象内时，最终分封顶
dims_weights:             # 与 prompts/category/*.md 中写的权重一致
  school:      {relevance: 0.35, action: 0.30, weight: 0.15, novelty: 0.10, credibility: 0.10}
  competition: {relevance: 0.30, action: 0.35, weight: 0.20, novelty: 0.10, credibility: 0.10}
  tech:        {relevance: 0.25, action: 0.15, weight: 0.25, novelty: 0.25, credibility: 0.10}
  news:        {relevance: 0.25, action: 0.10, weight: 0.30, novelty: 0.25, credibility: 0.10}
  email:       {relevance: 0.35, action: 0.35, weight: 0.15, novelty: 0.05, credibility: 0.10}

# ---------------------------------------------------------------- 排序时的截止临近加权
# 不改存储分；只影响“今日精选”的入选与排序、简报“今日必看”（截止越近越靠前，过期的往后沉）
deadline_rank:
  steps: [[3, 12], [7, 8], [14, 4]]   # [N 天内, 加分]
  expired_penalty: 15                 # 已过截止（且属于学校/竞赛）的扣分

block:              # 标题命中直接屏蔽（不展示）
  - 招标公告
  - 采购公告
  - 中标结果
  - 成交公告
  - 询价公告
  - 竞争性磋商

tags:               # 规则打标签：只看标题；英文按词边界匹配（模型打分时会合并）
  竞赛: [竞赛, 大赛, 挑战杯, 蓝桥杯, ICPC, ACM, CSP]
  大创: [大创, 大学生创新创业, 科研训练]
  奖助: [奖学金, 助学金]
  考试: [考试安排, 期中考试, 期末考试, 补考, 四六级, 六级, CET, 等级考试, 认证考试]
  选课: [选课, 退课, 补选]
  交流: [交换生, 交流项目, 访学, 寒假项目, 暑期项目, 学分项目]
  开源: [GitHub, Release, 开源]
  AI: [AI, AIGC, 大模型, LLM, DeepSeek, GPT, 人工智能]
